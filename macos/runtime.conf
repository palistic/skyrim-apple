# Keep the initial port's background shader compilation bounded.
dxvk.numCompilerThreads = 2
# Windows D3D9 drivers keep legacy shader math where 0 * rcp(0) is 0, not NaN.
# Vendored dxvk-native defaults its emulation off (FloatEmulationByDefault);
# mainstream DXVK keeps it on. With it, rcp/rsq/nrm/log clamp to +/-FLT_MAX and
# NaN shader constants become 0. Upstream Skyrim_Android 0.25 enabled it to fix
# NaNs reaching HDR/depth-of-field passes (black dots, black world map).
d3d9.floatEmulation = True
