name: SkyrimLauncher
options:
  bundleIdPrefix: dev.zschwendi.skyrim
  deploymentTarget:
    visionOS: "2.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: V729QMY3V6
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
    GENERATE_INFOPLIST_FILE: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SkyrimLauncher:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Sources
      - path: ../macos/launcher/SmokeBackground.metal
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zschwendi.skyrim.vision.launcher
        PRODUCT_NAME: SkyrimLauncher
        TARGETED_DEVICE_FAMILY: "7"
        SDKROOT: xros
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        MTL_ENABLE_DEBUG_INFO: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Skyrim
        CFBundleName: Skyrim
        LSApplicationCategoryType: public.app-category.games
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  SkyrimLauncher:
    build:
      targets:
        SkyrimLauncher: all
    run:
      config: Release
